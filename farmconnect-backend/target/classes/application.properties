spring.application.name=farmconnect-backend
server.port=8080

# H2 in-memory database (swap for MySQL/Postgres for production)
spring.datasource.url=jdbc:h2:mem:farmconnect;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console for inspecting data during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
